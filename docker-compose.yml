version: '3.8'

services:
  common-service:
    build: .
    container_name: efms-common-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_URL=${DB_URL:-jdbc:postgresql://common-db:5432/efms_common_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-yourpassword}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - PRIVATE_IDENTITY_SERVICE_URL=${PRIVATE_IDENTITY_SERVICE_URL:-http://efms-identity-service:8081}
