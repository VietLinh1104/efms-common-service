version: '3.8'

services:
  common-service:
    build: .
    container_name: efms-common-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_URL=${DB_URL:-jdbc:postgresql://common-db:5432/efms_common_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-yourpassword}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - IDENTITY_URL=${IDENTITY_URL:-http://efms-identity-service:8081}
    depends_on:
      - common-db

  common-db:
    image: postgres:16-alpine
    container_name: efms-common-db
    environment:
      - POSTGRES_DB=efms_common_db
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-yourpassword}
    ports:
      - "5435:5432" # Use 5435 to avoid conflict with identity-db (5433) and core-db (5434)
    volumes:
      - common-db-data:/var/lib/postgresql/data

volumes:
  common-db-data:
