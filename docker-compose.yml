version: "3.9"

# ============================================================
# EFMS Common Service – Docker Compose
# Chạy: docker compose up -d
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL (chỉ dùng khi chạy standalone, không dùng cloud)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: efms-common-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: efms_common
      POSTGRES_USER: ${DB_USERNAME:-linhdv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-linhdv_password}
    ports:
      - "5436:5432"
    volumes:
      - postgres_common_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-linhdv} -d efms_common"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - efms-network

  # ----------------------------------------------------------
  # EFMS Common Service
  # ----------------------------------------------------------
  efms-common-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: efms-common-service:latest
    container_name: efms-common-service
    restart: unless-stopped
    ports:
      - "${PORT:-8083}:8083"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod

      # Database – trỏ vào service postgres bên trên (hoặc override bằng .env)
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/efms_common}
      DB_USERNAME: ${DB_USERNAME:-linhdv}
      DB_PASSWORD: ${DB_PASSWORD:-linhdv_password}
      SHOW_SQL: ${SHOW_SQL:-false}

      # Server
      PORT: 8083

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # Inter-service
      IDENTITY_URL: ${IDENTITY_URL:-http://efms-identity-service:8081}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - efms-network

# ----------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------
volumes:
  postgres_common_data:
    driver: local

networks:
  efms-network:
    name: efms-network
    driver: bridge
    external: false
